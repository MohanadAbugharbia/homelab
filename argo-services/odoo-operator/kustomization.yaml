apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/MohanadAbugharbia/odoo-operator/releases/download/0.4.1/install.yaml

patches:
  # Since 0.3.0 the CRD embeds corev1.Probe and PodSecurityContext schemas and no
  # longer fits in the kubectl.kubernetes.io/last-applied-configuration
  # annotation; sync it with Replace (same pattern as the CNPG CRDs).
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: odoodeployments.odoo.abugharbia.com
    patch: |-
      - op: add
        path: "/metadata/annotations/argocd.argoproj.io~1sync-options"
        value: "Replace=true"
