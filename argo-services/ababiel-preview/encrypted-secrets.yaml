# Both secrets are sealed by the owner for the ababiel-preview namespace; see
# docs/ababiel-preview-runbook.md ("Seal the secrets") for the exact commands.
# This file must not be merged while the PASTE placeholders are still here:
# the sealed-secrets controller would refuse them and the previews would
# stay Pending with Degraded/DatabaseConnectionFailed.
---
# Same password as the pal_odoo managed role of shared-pg (the `shared`
# namespace copy of pal-odoo-db-cred), re-sealed for this namespace.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pal-odoo-db-cred
  namespace: ababiel-preview
spec:
  encryptedData:
    username: PASTE_KUBESEAL_OUTPUT
    password: PASTE_KUBESEAL_OUTPUT
  template:
    metadata:
      name: pal-odoo-db-cred
      namespace: ababiel-preview
---
# Pull secret for the private ghcr.io/mohanadabugharbia/pal-odoo package
# (a PAT with read:packages).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: ababiel-preview
spec:
  encryptedData:
    .dockerconfigjson: PASTE_KUBESEAL_OUTPUT
  template:
    type: kubernetes.io/dockerconfigjson
    metadata:
      name: ghcr-pull
      namespace: ababiel-preview
