# Caps the namespace at five concurrent preview environments: per environment
# the OdooDeployment requests 250m/512Mi and limits 2 CPU/2Gi (deploy/preview
# in pal-odoo), one Odoo pod runs at a time (the Deployment is scaled to zero
# while a maintenance Job runs) and one 2Gi filestore PVC exists.
# A sixth labelled PR sits Pending with Degraded/QuotaExceeded until one of
# the others is torn down.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ababiel-preview
  namespace: ababiel-preview
spec:
  hard:
    pods: "10"
    requests.cpu: "3"
    requests.memory: 5Gi
    limits.cpu: "10"
    limits.memory: 10Gi
    persistentvolumeclaims: "6"
    requests.storage: 20Gi
