apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-database
spec:
  instances: 1

  storage:
    size: 5Gi
    storageClass: longhorn

  # cloudnative-pg standard images ship pgvector
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 18

  managed:
    roles:
      - name: hindsight
        ensure: present
        login: true
        passwordSecret:
          name: hindsight-db-cred
  monitoring:
    enablePodMonitor: true
  switchoverDelay: 60

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: hindsight-database
spec:
  name: hindsight
  owner: hindsight
  cluster:
    name: hindsight-database
  extensions:
    - name: vector
      ensure: present
    - name: pg_trgm
      ensure: present
