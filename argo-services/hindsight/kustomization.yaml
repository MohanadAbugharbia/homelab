apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hindsight

resources:
  - encrypted-secrets.yaml
  - database.yaml
  - api-ingress.yaml

helmCharts:
- name: hindsight
  repo: oci://ghcr.io/vectorize-io/charts
  version: 0.10.2
  releaseName: hindsight
  namespace: hindsight
  valuesFile: values.yaml

patches:
  - target:
      kind: (Deployment|StatefulSet)
      name: hindsight-.*
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          reloader.stakater.com/auto: "true"
